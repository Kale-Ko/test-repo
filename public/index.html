<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Markdown Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Collaborative Markdown Editor</h1>
        </header>
        
        <div style="text-align: center; padding: 4rem 2rem;">
            <h2>Welcome to Collaborative Markdown Editor</h2>
            <p style="margin: 2rem 0; font-size: 1.1rem; color: #666;">
                Create and edit markdown documents in real-time with your team
            </p>
            
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="login.html" style="
                    display: inline-block;
                    padding: 1rem 2rem;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                    text-decoration: none;
                    border-radius: 15px;
                    font-weight: 600;
                    transition: transform 0.2s;
                ">Login</a>
                
                <a href="signup.html" style="
                    display: inline-block;
                    padding: 1rem 2rem;
                    background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
                    color: white;
                    text-decoration: none;
                    border-radius: 15px;
                    font-weight: 600;
                    transition: transform 0.2s;
                ">Sign Up</a>
            </div>
        </div>
    </div>
    
    <script>
        // Check if user is already logged in
        const user = localStorage.getItem('user');
        if (user) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
